apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-624
  labels:
    app: api-624
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-624
  template:
    metadata:
      labels:
        app: api-624
    spec:
      automountServiceAccountToken: false   # api-624 never calls the Kubernetes API
      # one Pod on each of the 3 nodes; matchLabelKeys counts only Pods of the same revision,
      # so a rolling update does not pile the new Pods onto the nodes the old ones are leaving
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys: [pod-template-hash]
          labelSelector:
            matchLabels:
              app: api-624
      containers:
        - name: app
          image: python:3.12-alpine
          command: ["python", "/app/app.py"]
          env:
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: PYTHONUNBUFFERED, value: "1"}
            - name: NODE_NAME   # shown in the page footer
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: code, mountPath: /app, readOnly: true}
      volumes:
        - name: code
          configMap:
            name: api-code   # generated by kustomization.yaml: app.py, common.py
---
apiVersion: v1
kind: Service
metadata:
  name: api-624
spec:
  selector:
    app: api-624
  ports:
    - port: 80
      targetPort: 8080
